name: RaceDay Part 2 CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RaceDay.Part2.sln

      - name: Build
        run: dotnet build RaceDay.Part2.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RaceDay.Part2.sln --configuration Release --no-build --verbosity normal