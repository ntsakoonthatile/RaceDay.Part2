
services:
  raceday-mvc:
    build:
      context: ./RaceDay.Mvc
      dockerfile: Dockerfile

    container_name: raceday-mvc

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ApiSettings__BaseUrl: http://host.docker.internal:5041/

    restart: unless-stopped
