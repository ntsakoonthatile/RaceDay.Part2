name: Import RaceDay Part 3 ZIP

on:
  push:
    paths:
      - 'RaceDay_Upload.zip'
      - 'RaceDay.Part3_GitHubReady.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raceday-part3-import
  cancel-in-progress: false

jobs:
  unpack-project:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract Part 3 sources
        shell: bash
        run: |
          set -euo pipefail
          if [ -f RaceDay_Upload.zip ]; then
            archive=RaceDay_Upload.zip
          elif [ -f RaceDay.Part3_GitHubReady.zip ]; then
            archive=RaceDay.Part3_GitHubReady.zip
          else
            echo "No RaceDay ZIP found in the repository root"
            exit 1
          fi
          unzip -tq "$archive"
          unzip -qo "$archive"
          rm -f RaceDay_Upload.zip RaceDay.Part3_GitHubReady.zip

      - name: Commit extracted project structure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No project changes to commit"
          else
            git commit -m "Import RaceDay Part 3 source folders and documentation"
            git push origin HEAD:main
          fi
